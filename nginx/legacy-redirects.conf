# Legacy URL redirects for educationhistory.lib.unb.ca. Until the Kubernetes 1.37 rebuild these were an
# ingress-nginx server-snippet in kubernetes-metadata; the Envoy Gateway that replaces
# ingress-nginx runs no snippets, so the image serves them itself. The base image includes
# this file inside its server block, ahead of `location /`.
#
# Relative Location headers: TLS ends at the Gateway and nginx here sees plain HTTP, so an
# absolute Location would name http:// and cost every visitor a second redirect.
absolute_redirect off;

location = /MacNTit   { return 301 /book/title-page; }
location = /MacNele   { return 301 /book/about-the-electronic-publication; }
location = /MacNfor   { return 301 /book/foreword; }
location = /MacNint   { return 301 /book/introduction; }
location = /MacNpre   { return 301 /book/preface; }
location = /MacNcon   { return 301 /book/table-of-contents; }
location = /MacNerr   { return 301 /book/errata; }
location = /MacNcha1  { return 301 /book/chapter-1; }
location = /MacNcha2  { return 301 /book/chapter-2; }
location = /MacNcha3  { return 301 /book/chapter-3; }
location = /MacNcha4  { return 301 /book/chapter-4; }
location = /MacNcha5  { return 301 /book/chapter-5; }
location = /MacNcha6  { return 301 /book/chapter-6; }
location = /MacNcha7  { return 301 /book/chapter-7; }
location = /MacNcha8  { return 301 /book/chapter-8; }
location = /MacNcha9  { return 301 /book/chapter-9; }
location = /MacNcha10 { return 301 /book/chapter-10; }
location = /MacNbib   { return 301 /book/bibliography; }
